version: '3.8'

services:
  mlflow:
    image: python:3.10-slim
    container_name: mlflow_server
    command: >
      bash -c "pip install mlflow==2.9.2 &&
               mlflow server --host 0.0.0.0 --port 5000
               --backend-store-uri sqlite:///mlflow.db
               --default-artifact-root /mlflow/artifacts"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    networks:
      - tc_net

  api:
    build: .
    container_name: tc_api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - ENVIRONMENT=production
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      - mlflow
    networks:
      - tc_net

  jupyter:
    build: .
    container_name: tc_jupyter
    command: >
      jupyter notebook --ip=0.0.0.0 --port=8888
      --no-browser --allow-root --NotebookApp.token=''
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    networks:
      - tc_net

volumes:
  mlflow_data:

networks:
  tc_net:
    driver: bridge